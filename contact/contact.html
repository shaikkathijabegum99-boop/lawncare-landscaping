<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seasonal Lawn Guide | GreenScape</title>

   
<link rel="icon" href="../images/favicon.png" />

  <link rel="stylesheet" href="../global/global.css" />
  <link rel="stylesheet" href="../css/com.css" />
  <link rel="stylesheet" href="./contact.css" />
</head>

<body>

<div id="navbar"></div>





<div class="page">

  <div class="card">

    
    <div class="left">

      
   

      <h1>Let’s Connect</h1>
      <p>Manage GreenScape scheduling, support, and service requests easily.</p>

      <div class="info">
        <div><i class="fas fa-phone"></i> +91 98765 43210</div>
        <div><i class="fas fa-envelope"></i> support@GreenScape.com</div>
        <div><i class="fas fa-location-dot"></i> Chennai, India</div>
      </div>

    </div>

    
    <div class="right">

      <h2>Send Message</h2>

      <form id="contactForm">

        <div class="field">
          <i class="fas fa-user"></i>
          <input type="text" id="name" placeholder="Full Name" required>
        </div>

        <div class="field">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="field">
          <i class="fas fa-phone"></i>
          <input type="text" id="phone" placeholder="Phone (optional)">
        </div>

        <div class="field textarea">
          <i class="fas fa-message"></i>
          <textarea id="message" placeholder="Your Message" required></textarea>
        </div>

        <button type="submit">
          <i class="fas fa-paper-plane"></i> Send Message
        </button>

        <p id="status"></p>

      </form>

    </div>

  </div>

</div>

<section class="map-section">

  <div class="container">

    <div class="map-header">
      <h2>Find Us</h2>
      <p>Visit our GreenScape office or contact us anytime.</p>
    </div>

    <div class="map-box">

      <iframe
        src="https://www.google.com/maps?q=Chennai,India&output=embed"
        allowfullscreen=""
        loading="lazy">
      </iframe>

    </div>

  </div>

</section>
<div id="footer"></div>

<script src="../global/global.js"></script>

<script src="../js/component.js"></script>
<script src="contact.js"></script>
</body>
</html>
